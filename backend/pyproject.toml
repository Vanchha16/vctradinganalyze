[project]
name = "claudetrading-backend"
version = "0.1.0"
description = "ClaudeTrading AI backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=25.1.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "prometheus-client>=0.26.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.13.0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "black>=24.10.0",
  "mypy>=1.14.0",
  "pytest>=8.3.4",
  "pytest-cov>=7.1.0",
  "ruff>=0.8.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# `source = ["app"]` alone already excludes `alembic/` (migrations,
# verified separately via `alembic upgrade`/`downgrade`/`check`, not the
# unit suite - docs/06 §21's "migrations" exclusion) and `scripts/`
# (one-off operator tooling - create_admin.py, seed_*.py, run_dev.py -
# run manually, not imported by any test), since neither lives under
# `app/`. `__init__.py` omitted separately below - every one in this
# codebase is a re-export aggregator only (e.g. `app/models/__init__.py`),
# no branches to miss.
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# Phase 9C (docs/60 §7, BACKLOG.md §4) - measure first, no failing
# threshold yet. Nobody has ever measured this number; a gate that fails
# on day one gets disabled and never re-enabled. Choosing a threshold is
# a follow-up decision informed by the real figure below.
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
