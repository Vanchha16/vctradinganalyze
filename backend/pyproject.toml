[project]
name = "claudetrading-backend"
version = "0.1.0"
description = "ClaudeTrading AI backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=25.1.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.13.0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "black>=24.10.0",
  "mypy>=1.14.0",
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
