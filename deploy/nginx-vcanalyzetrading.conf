# nginx site for ClaudeTrading AI. Install to /etc/nginx/sites-available/
# and symlink into sites-enabled/ (it currently replaces the stock
# `default` site on the production box).
#
# This is the HTTP-only base. Run `sudo certbot --nginx -d vcanalyzetrading.site
# -d www.vcanalyzetrading.site` afterwards: certbot rewrites this file in
# place, adding the 443 listener, the ssl_certificate paths and an HTTP->HTTPS
# redirect block. Do not copy those lines from the old host - the certificate
# they point at will not exist on the new one.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name vcanalyzetrading.site www.vcanalyzetrading.site _;

    # Next.js standalone server (frontend).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restrict /metrics to localhost only - nginx is the real access
    # boundary here, the METRICS_AUTH_TOKEN in .env is defence in depth
    # (Phase 9D, ADR-136). This block must stay ABOVE `location /api/`.
    location /api/v1/metrics {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000/api/v1/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
